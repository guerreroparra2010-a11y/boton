<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>boton</title>
  <link rel="stylesheet" href="boto.css">
</head>
<body>

  <input type="text" id="edad" placeholder="Ingresa tu edad">
  <br><br>
  <input type="text" id="altura" placeholder="Ingresa tu altura">
  <br><br>
  <input type="button" value="boton" id="booton" class="boton" onclick="alert('Tiene la edad: ' + document.getElementById('edad').value + ' y la altura: ' + document.getElementById('altura').value)">

</body>
</html>
